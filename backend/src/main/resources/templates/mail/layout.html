<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" th:fragment="layout(content)">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width"/>
</head>
<body style="margin:0;padding:24px;background:#f5f4f0;font-family:-apple-system,Segoe UI,Helvetica,Arial,sans-serif;color:#1c1b19;">
<table role="presentation" width="100%" cellspacing="0" cellpadding="0">
  <tr>
    <td align="center">
      <table role="presentation" width="560" cellspacing="0" cellpadding="0" style="background:#ffffff;border-radius:8px;padding:32px;">
        <tr><td style="font-size:15px;line-height:1.55;">
          <th:block th:replace="${content}"/>
        </td></tr>
      </table>
      <p style="font-size:12px;color:#77736a;margin-top:16px;" th:text="#{mail.footer}">footer</p>
    </td>
  </tr>
</table>
</body>
</html>
