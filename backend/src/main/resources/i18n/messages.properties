# Account export and deletion
mail.export-ready.subject=Your export of {0} is ready
mail.export-ready.intro=The full export of {0} is ready: all data as JSON and spreadsheets, every invoice as a PDF, and all receipts.
mail.export-ready.button=Download the export
mail.export-ready.footer=You can download it until {0}. Only admins of the account can download it.
mail.account-deletion.subject={0} will be deleted on {1}
mail.account-deletion.intro={1} asked to delete {0}. On {2} the account and everything in it will be deleted for good: time, expenses, invoices, receipts and people.
mail.account-deletion.export=Until then the account is read-only, and you can still download a full export of its data.
mail.account-deletion.button=Export or cancel
mail.account-deletion.footer=Any admin can cancel the deletion until then. You receive this because you are an admin of {0}.
mail.account-deletion-cancelled.subject=Deletion of {0} cancelled
mail.account-deletion-cancelled.intro={1} cancelled the deletion of {0}. Nothing will be deleted, and the account works as before.
mail.account-deletion-cancelled.button=Open Honest Robin

# Email confirmation
mail.verify-email.subject=Confirm your email address
mail.verify-email.intro=Welcome to Honest Robin. Please confirm that this is your email address. Until you do, your account can't send invitations, invoices or reminders.
mail.verify-email.button=Confirm my email address
mail.verify-email.footer=If you didn't sign up for Honest Robin, ignore this email and nothing will happen.
mail.security-notice.subject=About signing in to your Honest Robin account
mail.security-notice.two-factor-on=Two-factor sign-in is now on. From now on you enter a code from your authenticator app when you sign in.
mail.security-notice.two-factor-off=Two-factor sign-in was turned off. You now sign in with your password or an emailed link alone.
mail.security-notice.recovery-used=A recovery code was used to sign in. You have {0} left; make new ones under your profile when they run low.
mail.security-notice.recovery-new=New recovery codes were made. The old ones no longer work.
mail.security-notice.code-failures=Someone entered your password correctly, then a wrong two-factor code {0} times today. If that wasn''t you, someone knows your password: change it now. Your two-factor sign-in kept them out.
mail.security-notice.address-claimed=You signed in with a link sent to this address before it was confirmed. To keep the account yours, whoever set it up before can''t sign in any more: its password, two-factor sign-in and API tokens were removed. Set a password under your profile if you''d like one.
mail.security-notice.button=Review your sign-in settings
mail.security-notice.not-you=If this wasn't you, reset your password now and tell your workspace admin.
