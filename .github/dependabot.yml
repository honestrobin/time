# Monthly update pull requests, one per ecosystem, so pinned versions don't quietly go stale.
# Security updates (Dependabot alerts) arrive separately, as soon as an advisory is published.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    groups:
      actions:
        patterns: ["*"]
  - package-ecosystem: gradle
    directory: /
    schedule:
      interval: monthly
    groups:
      gradle:
        patterns: ["*"]
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: monthly
    groups:
      npm:
        patterns: ["*"]
    ignore:
      # openapi-typescript builds the API client with TypeScript's compiler API, which TypeScript 7
      # doesn't offer yet (decision record 0007). Lift this when openapi-typescript supports it.
      - dependency-name: typescript
        update-types: ["version-update:semver-major"]
      # Node's types follow the Node version we run (24, the LTS line).
      - dependency-name: "@types/node"
        update-types: ["version-update:semver-major"]
