# SPDX-License-Identifier: AGPL-3.0-only
name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  dco:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
      - name: Every commit carries a DCO sign-off
        run: |
          missing=0
          for sha in $(git rev-list ${{ github.event.pull_request.base.sha }}..${{ github.event.pull_request.head.sha }}); do
            if ! git show -s --format=%B "$sha" | grep -q '^Signed-off-by: '; then
              echo "Commit $sha has no Signed-off-by line (use git commit -s)"; missing=1
            fi
          done
          exit $missing

  licences:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4.9.1
        with: { distribution: temurin, java-version: 21, cache: gradle }
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.3.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with: { node-version: 22, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - name: SPDX headers
        run: scripts/check-license-headers.sh
      - name: npm dependency licences
        run: node scripts/check-npm-licenses.mjs
      - name: JVM dependency licences
        run: ./gradlew --no-daemon :backend:checkLicense

  backend:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        edition: [selfhost, cloud]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4.9.1
        with: { distribution: temurin, java-version: 21, cache: gradle }
      - name: Unit and integration tests (Testcontainers Postgres)
        run: ./gradlew --no-daemon :backend:test
        env:
          HONESTROBIN_EDITION: ${{ matrix.edition }}
      - name: OpenAPI document is up to date
        if: matrix.edition == 'selfhost'
        run: git diff --exit-code packages/api-client/openapi.json
      - name: jOOQ classes match the migrations
        if: matrix.edition == 'selfhost'
        run: ./gradlew --no-daemon :backend:jooqCodegen && git diff --exit-code backend/src/generated
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: failure()
        with:
          name: backend-test-report-${{ matrix.edition }}
          path: backend/build/reports/tests

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.3.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with: { node-version: 22, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - name: Generated API client is up to date
        run: pnpm --filter @honestrobin/api-client build && git diff --exit-code packages/api-client/src
      - run: pnpm -r typecheck
      # The e2e package needs a running instance and a browser; it has its own job below.
      - run: pnpm --filter '!@honestrobin/e2e' -r --if-present test
      - run: pnpm --filter @honestrobin/web build
      - name: Browser extension (Chrome and Firefox builds)
        run: pnpm --filter @honestrobin/extension build
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: browser-extension
          path: extension/dist

  e2e:
    needs: [backend, frontend]
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        edition: [selfhost, cloud]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.3.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with: { node-version: 22, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - name: The HTTPS setup (Caddy) is valid compose
        run: HONESTROBIN_DOMAIN=app.example.com docker compose -f deploy/docker-compose.yml -f deploy/docker-compose.https.yml config -q
      - name: docker compose up on a clean machine (AT-0.1)
        run: docker compose -f deploy/docker-compose.yml up -d --build --wait --wait-timeout 300
        env:
          HONESTROBIN_EDITION: ${{ matrix.edition }}
      - name: Wait for the app
        run: timeout 180 bash -c 'until curl -fsS http://localhost:8080/actuator/health/readiness; do sleep 2; done'
      - run: pnpm --filter @honestrobin/e2e exec playwright install --with-deps chromium
      - name: Browser extension, e2e build (allows http://localhost)
        run: pnpm --filter @honestrobin/extension build:e2e
      - run: pnpm --filter @honestrobin/e2e test
        env:
          CI: "true"
          HONESTROBIN_E2E_BASE_URL: http://localhost:8080
      - name: No errors in the app log
        run: |
          if docker compose -f deploy/docker-compose.yml logs app | grep -E " ERROR "; then
            echo "The app logged errors during the end-to-end tests"; exit 1
          fi
      - name: App state (threads, database sessions)
        if: failure()
        run: |
          curl -sS -m 5 http://localhost:8080/actuator/health || echo "health check did not answer"
          docker compose -f deploy/docker-compose.yml exec -T db psql -U honestrobin -d honestrobin -c \
            "select pid, state, wait_event_type, wait_event, now() - xact_start as in_tx, left(query, 160) as query from pg_stat_activity where datname = 'honestrobin' order by xact_start"
          docker compose -f deploy/docker-compose.yml kill -s QUIT app || true
          sleep 2
      - name: App logs
        if: failure()
        run: docker compose -f deploy/docker-compose.yml logs app
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: failure()
        with:
          name: playwright-report-${{ matrix.edition }}
          path: e2e/playwright-report

  # Publishes ghcr.io/honestrobin/time:main (and :sha-<commit>) once every check above passed, for
  # test servers. Releases get :latest and version tags from release.yml. The jar is built once
  # here; each architecture's image only adds it to the Java runtime, so nothing compiles under
  # emulation.
  image:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [licences, backend, frontend, e2e]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    env:
      # Said on the image itself, where everyone who pulls it sees it.
      IMAGE_NOTES: |
        org.opencontainers.image.title=Honest Robin: Time (development build)
        org.opencontainers.image.description=Development build of the main branch: the newest code that passed every test. Not a release: it can break, and it comes with no promises. For real work, use a release.
        org.opencontainers.image.licenses=AGPL-3.0-only
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.3.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with: { node-version: 22, cache: pnpm }
      - run: pnpm install --frozen-lockfile --filter @honestrobin/web...
      - run: pnpm --filter @honestrobin/web build
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4.9.1
        with: { distribution: temurin, java-version: 21, cache: gradle }
      - name: The jar, with the web app inside
        run: ./gradlew --no-daemon :backend:bootJar -PhonestrobinVersion=main-${GITHUB_SHA::7} -x test
      - uses: docker/setup-qemu-action@c7c53464625b32c7a7e944ae62b3e17d2b600130 # v3.7.0
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0
      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@c299e40c65443455700f0fdfc63efafe5b349051 # v5.10.0
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=raw,value=main
            type=sha
          labels: ${{ env.IMAGE_NOTES }}
          annotations: ${{ env.IMAGE_NOTES }}
        env:
          DOCKER_METADATA_ANNOTATIONS_LEVELS: manifest,index
      - uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6.19.2
        with:
          context: backend/build/libs
          file: deploy/Dockerfile
          target: prebuilt
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          annotations: ${{ steps.meta.outputs.annotations }}
          # A list of everything inside, with licences where known (docs/self-host.md).
          sbom: true
