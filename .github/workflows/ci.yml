# SPDX-License-Identifier: AGPL-3.0-only
name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  dco:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Every commit carries a DCO sign-off
        run: |
          missing=0
          for sha in $(git rev-list ${{ github.event.pull_request.base.sha }}..${{ github.event.pull_request.head.sha }}); do
            if ! git show -s --format=%B "$sha" | grep -q '^Signed-off-by: '; then
              echo "Commit $sha has no Signed-off-by line (use git commit -s)"; missing=1
            fi
          done
          exit $missing

  licences:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with: { distribution: temurin, java-version: 25, cache: gradle }
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with: { node-version: 24, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - name: SPDX headers
        run: scripts/check-license-headers.sh
      - name: npm dependency licences
        run: node scripts/check-npm-licenses.mjs
      - name: JVM dependency licences
        run: ./gradlew --no-daemon :backend:checkLicense

  backend:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        edition: [selfhost, cloud]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with: { distribution: temurin, java-version: 25, cache: gradle }
      - name: Unit and integration tests (Testcontainers Postgres)
        run: ./gradlew --no-daemon :backend:test
        env:
          HONESTROBIN_EDITION: ${{ matrix.edition }}
      - name: OpenAPI document is up to date
        if: matrix.edition == 'selfhost'
        run: git diff --exit-code packages/api-client/openapi.json
      - name: jOOQ classes match the migrations
        if: matrix.edition == 'selfhost'
        run: ./gradlew --no-daemon :backend:jooqCodegen && git diff --exit-code backend/src/generated
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: failure()
        with:
          name: backend-test-report-${{ matrix.edition }}
          path: backend/build/reports/tests

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with: { node-version: 24, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - name: Generated API client is up to date
        run: pnpm --filter @honestrobin/api-client build && git diff --exit-code packages/api-client/src
      - run: pnpm -r typecheck
      # The e2e package needs a running instance and a browser; it has its own job below.
      - run: pnpm --filter '!@honestrobin/e2e' -r --if-present test
      - run: pnpm --filter @honestrobin/web build
      - name: Browser extension (Chrome and Firefox builds)
        run: pnpm --filter @honestrobin/extension build
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: browser-extension
          path: extension/dist

  e2e:
    needs: [backend, frontend]
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        edition: [selfhost, cloud]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with: { node-version: 24, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - name: The HTTPS setup (Caddy) is valid compose
        run: HONESTROBIN_DOMAIN=app.example.com docker compose -f deploy/docker-compose.yml -f deploy/docker-compose.https.yml config -q
      - name: docker compose up on a clean machine (AT-0.1)
        run: docker compose -f deploy/docker-compose.yml up -d --build --wait --wait-timeout 300
        env:
          HONESTROBIN_EDITION: ${{ matrix.edition }}
          HONESTROBIN_SETUP_CODE: e2e-setup-code
          # The end-to-end tests cover every feature, switched on or not by default.
          HONESTROBIN_FEATURES: all
      - name: Wait for the app
        run: timeout 180 bash -c 'until curl -fsS http://localhost:8080/actuator/health/readiness; do sleep 2; done'
      - run: pnpm --filter @honestrobin/e2e exec playwright install --with-deps chromium
      - name: Browser extension, e2e build (allows http://localhost)
        run: pnpm --filter @honestrobin/extension build:e2e
      - run: pnpm --filter @honestrobin/e2e test
        env:
          CI: "true"
          HONESTROBIN_E2E_BASE_URL: http://localhost:8080
          HONESTROBIN_SETUP_CODE: e2e-setup-code
      - name: No errors in the app log
        run: |
          if docker compose -f deploy/docker-compose.yml logs app | grep -E " ERROR "; then
            echo "The app logged errors during the end-to-end tests"; exit 1
          fi
      # Most people get the default switches: the same instance again with only the core.
      - name: The core alone, with the default switches
        run: |
          docker compose -f deploy/docker-compose.yml up -d --no-build --wait --wait-timeout 300 app
          timeout 180 bash -c 'until curl -fsS http://localhost:8080/actuator/health/readiness; do sleep 2; done'
          curl -fsS http://localhost:8080/api/v1/auth/config | grep -q '"features":\[\]'
          pnpm --filter @honestrobin/e2e exec playwright test tests/40-default-core.spec.ts
          if docker compose -f deploy/docker-compose.yml logs app | grep -E " ERROR "; then
            echo "The app logged errors with the default switches"; exit 1
          fi
        env:
          HONESTROBIN_EDITION: ${{ matrix.edition }}
          HONESTROBIN_SETUP_CODE: e2e-setup-code
          HONESTROBIN_FEATURES: ""
          CI: "true"
          HONESTROBIN_E2E_BASE_URL: http://localhost:8080
      - name: App state (threads, database sessions)
        if: failure()
        run: |
          curl -sS -m 5 http://localhost:8080/actuator/health || echo "health check did not answer"
          docker compose -f deploy/docker-compose.yml exec -T db psql -U honestrobin -d honestrobin -c \
            "select pid, state, wait_event_type, wait_event, now() - xact_start as in_tx, left(query, 160) as query from pg_stat_activity where datname = 'honestrobin' order by xact_start"
          docker compose -f deploy/docker-compose.yml kill -s QUIT app || true
          sleep 2
      - name: App logs
        if: failure()
        run: docker compose -f deploy/docker-compose.yml logs app
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: failure()
        with:
          name: playwright-report-${{ matrix.edition }}
          path: e2e/playwright-report

  # Publishes ghcr.io/honestrobin/time:main (and :sha-<commit>) once every check above passed, for
  # test servers. A release is this same image: release.yml gives it :latest and version tags
  # without building again. The jar is built once here; each architecture's image only adds it to
  # the Java runtime, so nothing compiles under emulation.
  image:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [licences, backend, frontend, e2e]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    env:
      # Said on the image itself, where everyone who pulls it sees it. A release is this same
      # image under a version tag (release.yml), so the words hold for both.
      IMAGE_NOTES: |
        org.opencontainers.image.title=Honest Robin: Time
        org.opencontainers.image.description=Built from one commit of the main branch once every test passed. Tagged main or sha-<commit>, it's a development build: it can break, and it comes with no promises. For real work, use a release: the same kind of image, tagged with a version number.
        org.opencontainers.image.licenses=AGPL-3.0-only
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with: { node-version: 24, cache: pnpm }
      - run: pnpm install --frozen-lockfile --filter @honestrobin/web...
      - run: pnpm --filter @honestrobin/web build
      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with: { distribution: temurin, java-version: 25, cache: gradle }
      - name: The jar, with the web app inside
        run: ./gradlew --no-daemon :backend:bootJar -PhonestrobinVersion=main-${GITHUB_SHA::7} -x test
      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=raw,value=main
            type=sha
          labels: ${{ env.IMAGE_NOTES }}
          annotations: ${{ env.IMAGE_NOTES }}
        env:
          DOCKER_METADATA_ANNOTATIONS_LEVELS: manifest,index
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: backend/build/libs
          file: deploy/Dockerfile
          target: prebuilt
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          annotations: ${{ steps.meta.outputs.annotations }}
          # A list of everything inside, with licences where known (docs/self-host.md).
          sbom: true
