# On a server with your own domain: HTTPS through Caddy, with automatic certificates.
#   HONESTROBIN_DOMAIN=app.example.com docker compose -f deploy/docker-compose.yml -f deploy/docker-compose.https.yml up -d
# Point the domain's DNS (an A record, and AAAA for IPv6) at the server first.
services:
  app:
    ports: !reset []
    environment:
      HONESTROBIN_BASE_URL: https://${HONESTROBIN_DOMAIN:?Set HONESTROBIN_DOMAIN, for example app.example.com}

  caddy:
    image: docker.io/library/caddy:2-alpine
    restart: unless-stopped
    depends_on:
      - app
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    environment:
      HONESTROBIN_DOMAIN: ${HONESTROBIN_DOMAIN}
      # Behind Cloudflare or another proxy: see docs/self-host.md. The defaults trust no one.
      HONESTROBIN_TRUSTED_PROXIES: ${HONESTROBIN_TRUSTED_PROXIES:-127.0.0.1/32}
      HONESTROBIN_CLIENT_IP_HEADER: ${HONESTROBIN_CLIENT_IP_HEADER:-X-Forwarded-For}
    volumes:
      - ./caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config

volumes:
  caddy-data:
  caddy-config:
